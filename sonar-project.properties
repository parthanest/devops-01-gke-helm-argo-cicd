# =============================================================================
# SonarQube analysis configuration
# =============================================================================
# The project identity in SonarQube. Keep the key stable across runs so history
# is preserved. Override in CI via SONAR_PROJECT_KEY if you use multiple envs.
sonar.projectKey=demo-app
sonar.projectName=demo-app
sonar.projectVersion=1.0

# Source & test layout (Gradle plugin also auto-detects these).
sonar.sources=src/main
sonar.tests=src/test
sonar.java.binaries=build/classes

# Encoding
sonar.sourceEncoding=UTF-8

# sonar.host.url and sonar.token are supplied at runtime via env / secrets,
# never committed to the repo.
